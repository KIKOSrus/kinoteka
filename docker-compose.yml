services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kinoteka
      POSTGRES_PASSWORD: kinoteka
      POSTGRES_DB: kinoteka
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinoteka"]
      interval: 3s
      retries: 20

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://kinoteka:kinoteka@db:5432/kinoteka
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please-use-long-random-string}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static:/usr/share/nginx/static:ro
    depends_on:
      - backend

volumes:
  pgdata:
